uid: GUIDE-0001
type: guidance
status: ratified
title: How to write a form spec
text: 'The authoring guidance a form spec copies: the order to write a spec in, the
  rules tl check cannot enforce, and the GDS guidance behind them.'
rationale: 'Some GDS rules cannot be written as declarations or coverage rules: one
  start page, one otherwise route per page, unique answer keys, exclusive only on
  checkboxes, one thing per page, and plain-English error wording. An agent writing
  a form spec needs them in front of it, so the standard ships them as guidance that
  tl init copies into each new form spec.'
normative: true
