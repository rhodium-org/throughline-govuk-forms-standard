title: Guidance serves the intent
text: In this graph, a guidance item derives from the intent.
rationale: The meta-standard v1.1.0 declares the GUIDE register but no link out of
  it, so a guidance item cannot reach a root without an undeclared link. This graph
  declares the one link it needs, for itself only, as the meta-standard declares
  one for its registers and link types. The declaration belongs in the meta-standard;
  once it is there, this one goes.
