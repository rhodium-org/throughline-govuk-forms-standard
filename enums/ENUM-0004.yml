uid: ENUM-0004
type: enum
status: ratified
title: Autocomplete
text: 'One of: name, honorific-prefix, given-name, additional-name, family-name,
  email, tel, street-address, address-line1, address-line2, address-level1, address-level2,
  postal-code, country-name, bday, bday-day, bday-month, bday-year, organization.'
rationale: HTML autofill field names for information about the user. Declaring one
  meets WCAG 2.2 SC 1.3.5 Identify Input Purpose (wcag:SR-0015), which the GOV.UK
  Design System asks for on name, address, email, phone and date-of-birth fields.
