uid: INT-0001
type: intent
status: ratified
title: One model every GOV.UK form is specified in
text: A GOV.UK form is specified as a graph of pages, questions, options, validations
  and routes, so it can be checked against GDS guidance before anyone builds it,
  and a prototype, a service and its tests can be read from the same specification.
  The standard holds what a form is, never how it is rendered.
