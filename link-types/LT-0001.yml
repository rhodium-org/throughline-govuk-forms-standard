uid: LT-0001
type: link_type
status: ratified
title: The link type part_of
text: A form spec's part_of link.
rationale: 'A page is part of the form or of one of its sections, and a section is
  part of the form. This is how every page reaches the one form, so a change to the
  form marks its pages suspect. GDS task-list pattern: a long form is split into
  sections a user completes in any order.'
