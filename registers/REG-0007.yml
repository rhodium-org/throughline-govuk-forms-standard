uid: REG-0007
type: register
status: ratified
title: A form spec's routes live in RT
text: A form spec holds its route items in RT, folder routes/.
rationale: A route is one way out of a page, to the next page, possibly only when
  an option is chosen. The routes make the journey, so it can be checked for unreachable
  pages and dead ends before it is built.
normative: true
